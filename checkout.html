<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAMPAY — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap">

</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="ic-whatsapp" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-bag" viewBox="0 0 24 24"><path d="M6 8h12l1 13H5L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></symbol>
</svg>

<header class="site">
  <div class="wrap topbar">
    <a class="brandmark" href="index.html"><img class="brand-icon" src="assets/img/logo.png" alt="">PAMPAY</a>
    <div class="side icons">
      <button class="icon-btn" id="cartOpenBtn" aria-label="Carrito"><svg><use href="#ic-bag"/></svg><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="breadcrumb" style="padding-top:1.6rem;"><a href="index.html">Inicio</a> / Checkout</div>

  <div id="checkoutBody">
    <div class="checkout-grid">
      <div class="co-form">
        <h2 style="font-size:1.4rem;">Datos de envío</h2>
        <form id="shippingForm">
          <label for="coName">Nombre completo</label>
          <input type="text" id="coName" required>

          <label for="coPhone">Celular (WhatsApp)</label>
          <input type="tel" id="coPhone" required placeholder="3XX XXX XXXX">

          <div class="co-row">
            <div>
              <label for="coCity">Ciudad</label>
              <input type="text" id="coCity" required>
            </div>
            <div>
              <label for="coDept">Departamento</label>
              <input type="text" id="coDept" required>
            </div>
          </div>

          <label for="coAddress">Dirección</label>
          <input type="text" id="coAddress" required>

          <label for="coNotes">Notas del pedido (opcional)</label>
          <input type="text" id="coNotes" placeholder="Punto de referencia, horario, etc.">

          <div style="margin-top:2rem; padding:1.1rem; border:1px solid var(--line); background:var(--white);">
            <div class="lbl" style="margin-bottom:.6rem;">Método de pago</div>
            <button type="button" class="btn ghost block" disabled>Tarjeta / PSE — próximamente</button>
            <p class="pdp-note" style="margin-top:.8rem;">Estamos activando el pago en línea. Por ahora, confirma tu pedido y coordinamos el pago (contraentrega, Nequi o transferencia) por WhatsApp.</p>
          </div>

          <button type="submit" class="btn primary block" id="finishBtn" style="margin-top:1.4rem;">Finalizar pedido por WhatsApp</button>
        </form>
      </div>

      <div class="co-summary">
        <h3 style="font-size:1.05rem; margin-bottom:1rem;">Tu pedido</h3>
        <div id="coLines"></div>
        <div class="co-totals" id="coTotals"></div>
      </div>
    </div>
  </div>
</div>

<footer class="site" style="margin-top:3rem;">
  <div class="wrap foot-bottom">© PAMPAY. Todos los derechos reservados.</div>
</footer>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-whatsapp"/></svg>
</a>

<script src="assets/js/products.js?v=3"></script>
<script src="assets/js/cart.js?v=1"></script>
<script src="assets/js/chrome.js?v=1"></script>
<script src="assets/js/checkout.js?v=1"></script>
</body>
</html>
